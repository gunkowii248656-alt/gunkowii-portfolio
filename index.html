<body>

<!-- (existing body content unchanged up to the contact section) -->

<section id="contact" class="contact">
  <div class="container">
    <div class="label">Get in touch</div>
    <h2>Let's <span>work</span> together</h2>
    <p class="section-text">I help stores grow revenue—reach out and tell me about your goals.</p>

    <!-- Static contact form (accessible) -->
    <div id="contact-form-wrapper" style="max-width:760px;margin:28px auto 0;background:rgba(255,255,255,.02);padding:18px;border-radius:8px">
      <form id="contactForm" method="POST" action="https://formsubmit.co/ahmeedagunko@gmail.com">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <label class="sr-only" for="c-name">Name</label>
          <input id="c-name" name="name" placeholder="Your name" required style="flex:1;padding:12px;border-radius:6px;border:1px solid rgba(0,0,0,.08)">
          <label class="sr-only" for="c-email">Email</label>
          <input id="c-email" name="email" type="email" placeholder="Email address" required style="flex:1;padding:12px;border-radius:6px;border:1px solid rgba(0,0,0,.08)">
        </div>
        <div style="margin-top:12px">
          <label class="sr-only" for="c-message">Message</label>
          <textarea id="c-message" name="message" rows="6" placeholder="Tell me about your store & goals" required style="width:100%;padding:12px;border-radius:6px;border:1px solid rgba(0,0,0,.08)"></textarea>
        </div>
        <div style="margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:flex-start">
          <button id="contactSubmit" type="submit" class="primary" style="background:#c29d4a;color:#14251d;padding:10px 16px;border-radius:6px;border:none;font-weight:700;cursor:pointer">Send message</button>
          <small style="color:var(--muted)">Or email directly: <a href="mailto:ahmeedagunko@gmail.com">ahmeedagunko@gmail.com</a></small>
        </div>
        <div id="contactFormMessage" aria-live="polite" style="margin-top:10px;color:var(--muted)"></div>
      </form>
      <noscript><div style="margin-top:10px;color:var(--muted)">JavaScript is required for inline submission. Use <a href="mailto:ahmeedagunko@gmail.com">email</a> to contact.</div></noscript>
    </div>

  </div>
</section>
