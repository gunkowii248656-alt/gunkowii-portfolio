<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUNKOWII SABA | E-commerce & Digital Solutions Specialist</title>

    <meta name="description"
        content="GUNKOWII SABA — E-commerce, Shopify, email marketing, web development and digital solutions for businesses.">

    <meta name="author" content="GUNKOWII SABA">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f4ed;
            color: #14251d;
            line-height: 1.7;
        }

        a {
            transition: all 0.25s ease;
        }

        .container {
            width: 90%;
            max-width: 1180px;
            margin: auto;
        }

        /* =========================
           NAVIGATION
        ========================= */

        header {
            background: #14251d;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        nav {
            min-height: 76px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: #c29d4a;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            color: #eef2ef;
            text-decoration: none;
            font-size: 0.88rem;
        }

        .nav-links a:hover {
            color: #c29d4a;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 88vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 90% 15%, rgba(194,157,74,0.16), transparent 30%),
                linear-gradient(135deg, #f7f4ed, #e9e2d4);
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border: 1px solid rgba(146,112,44,0.18);
            border-radius: 50%;
            right: -180px;
            bottom: -180px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            align-items: center;
            gap: 60px;
            position: relative;
            z-index: 2;
        }

        .hero-content {
            padding: 90px 0;
        }

        .eyebrow {
            color: #92702c;
            font-size: 0.78rem;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 0.88rem;
            font-weight: bold;
            color: #14251d;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-family: Georgia, serif;
            font-size: clamp(3rem, 6vw, 5.8rem);
            line-height: 0.98;
            letter-spacing: -2px;
            margin-bottom: 28px;
        }

        .hero h1 span {
            color: #92702c;
            display: block;
        }

        .hero p {
            max-width: 690px;
            color: #59645e;
            font-size: 1.05rem;
            margin-bottom: 32px;
        }

        /* =========================
           PROFILE IMAGE
        ========================= */

        .hero-image {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .portrait-frame {
            width: min(430px, 100%);
            aspect-ratio: 4 / 5;
            padding: 10px;
            background: #c29d4a;
            box-shadow: 25px 25px 0 #14251d;
            position: relative;
        }

        .portrait-frame::before {
            content: "";
            position: absolute;
            inset: 22px;
            border: 1px solid rgba(255,255,255,0.65);
            z-index: 2;
            pointer-events: none;
        }

        .portrait {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            background: #ddd;
        }

        .profile-caption {
            position: absolute;
            left: -25px;
            bottom: 35px;
            background: #14251d;
            color: white;
            padding: 14px 20px;
            z-index: 3;
            box-shadow: 5px 5px 0 #c29d4a;
        }

        .profile-caption strong {
            display: block;
            font-family: Georgia, serif;
            font-size: 1rem;
        }

        .profile-caption span {
            color: #c29d4a;
            font-size: 0.72rem;
            letter-spacing: 1px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }

        .primary {
            background: #14251d;
            color: white;
        }

        .primary:hover {
            background: #92702c;
        }

        .secondary {
            border: 1px solid #14251d;
            color: #14251d;
        }

        .secondary:hover {
            background: #14251d;
            color: white;
        }

        /* =========================
           GENERAL SECTIONS
        ========================= */

        section {
            padding: 105px 0;
        }

        .label {
            color: #92702c;
            font-size: 0.76rem;
            font-weight: bold;
            letter-spacing: 2.5px;
            margin-bottom: 16px;
        }

        h2 {
            font-family: Georgia, serif;
            font-size: clamp(2.4rem, 5vw, 4.2rem);
            line-height: 1.08;
            letter-spacing: -1px;
            margin-bottom: 28px;
        }

        h2 span {
            color: #92702c;
        }

        .section-text {
            max-width: 780px;
            color: #59645e;
            margin-bottom: 18px;
            font-size: 1rem;
        }

        /* =========================
           ABOUT
        ========================= */

        .about-grid {
            display: grid;
            grid-template-columns: 1.4fr 0.6fr;
            gap: 60px;
            align-items: start;
        }

        .about-card {
            background: white;
            border: 1px solid #ded8cb;
            padding: 32px;
        }

        .about-card strong {
            display: block;
            font-family: Georgia, serif;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .about-card p {
            color: #59645e;
            font-size: 0.92rem;
        }

        /* =========================
           SERVICES
        ========================= */

        .dark-section {
            background: #14251d;
            color: white;
        }

        .dark-section .label {
            color: #c29d4a;
        }

        .dark-section h2 span {
            color: #c29d4a;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 48px;
        }

        .service {
            padding: 34px;
            border: 1px solid #39483f;
            background: #1b3026;
        }

        .service:hover {
            border-color: #c29d4a;
            transform: translateY(-3px);
        }

        .service-number {
            color: #c29d4a;
            font-weight: bold;
            font-size: 0.82rem;
            margin-bottom: 16px;
        }

        .service h3 {
            font-family: Georgia, serif;
            font-size: 1.55rem;
            margin-bottom: 10px;
        }

        .service p {
            color: #bdc7c0;
            font-size: 0.93rem;
        }

        /* =========================
           PROJECTS
        ========================= */

        .project-intro {
            max-width: 760px;
            color: #59645e;
        }

        .project {
            background: white;
            border: 1px solid #ded8cb;
            padding: 48px;
            margin-top: 45px;
        }

        .project small {
            color: #92702c;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .project h3 {
            font-family: Georgia, serif;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.1;
            margin: 16px 0;
        }

        .project p {
            color: #59645e;
            max-width: 760px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 28px;
        }

        .tags span {
            background: #eee8dc;
            padding: 7px 12px;
            font-size: 0.78rem;
            font-weight: bold;
        }

        /* =========================
           PROCESS
        ========================= */

        .process {
            background: #eee8dc;
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-top: 48px;
        }

        .step {
            background: #f7f4ed;
            padding: 25px;
            border: 1px solid #ded8cb;
        }

        .step strong {
            color: #92702c;
            font-size: 0.85rem;
        }

        .step h3 {
            margin: 12px 0 7px;
            font-family: Georgia, serif;
        }

        .step p {
            font-size: 0.86rem;
            color: #59645e;
        }

        /* =========================
           WHY WORK WITH ME
        ========================= */

        .why-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 45px;
        }

        .why-card {
            background: white;
            border: 1px solid #ded8cb;
            padding: 30px;
        }

        .why-card strong {
            display: block;
            font-family: Georgia, serif;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .why-card p {
            color: #59645e;
            font-size: 0.9rem;
        }

        /* =========================
           CTA
        ========================= */

        .cta {
            background: white;
            border-top: 1px solid #ded8cb;
            border-bottom: 1px solid #ded8cb;
        }

        .cta-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        .cta-box p {
            max-width: 650px;
            color: #59645e;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact {
            background: #14251d;
            color: white;
            text-align: center;
        }

        .contact .label {
            color: #c29d4a;
        }

        .contact h2 span {
            color: #c29d4a;
        }

        .contact p {
            max-width: 650px;
            margin: 0 auto 32px;
            color: #bdc7c0;
        }

        .contact-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .contact .primary {
            background: #c29d4a;
            color: #14251d;
        }

        .contact .primary:hover {
            background: white;
        }

        .contact .secondary {
            border-color: #c29d4a;
            color: white;
        }

        .contact .secondary:hover {
            background: #c29d4a;
            color: #14251d;
        }

        .contact-info {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            font-size: 0.88rem;
        }

        .contact-info a {
            color: #bdc7c0;
            text-decoration: none;
        }

        .contact-info a:hover {
            color: #c29d4a;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #0c1712;
            color: #9daaa2;
            padding: 28px 0;
            text-align: center;
            font-size: 0.82rem;
        }

        footer strong {
            color: white;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .hero-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .hero-content {
